name: Build Vue
on: 
  push:
    branches:
      - main
jobs:
  build_vue:
    runs-on: ubuntu-latest
    name: Build Vue
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Use PNPM
      uses: pnpm/action-setup@v4
      with:
        version: 11
    - id: Build-Vue
      uses: MohaElder/VuePagesAction@1.0.2
      with:
        username: 'MohaElder'
        reponame: 'me'
        token: ${{ secrets.GITHUB_TOKEN }} # Leave this line unchanged

